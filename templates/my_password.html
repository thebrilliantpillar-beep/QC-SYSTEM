{% extends "base.html" %}
{% block title %}내 비밀번호 변경{% endblock %}
{% block content %}
<div class="card" style="max-width:340px; margin:20px auto;">
  <h2>내 비밀번호 변경</h2>
  <form method="POST">
    <label>현재 비밀번호</label>
    <input name="current_password" type="password" required>
    <label>새 비밀번호</label>
    <input name="new_password" type="text" required>
    <button type="submit" style="width:100%;">변경</button>
  </form>
</div>
{% endblock %}
