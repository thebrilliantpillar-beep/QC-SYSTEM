{% extends "base.html" %}
{% block title %}이메일 설정 — Chardon QMS{% endblock %}
{% block content %}
<h2>✉️ 이메일 (SMTP) 설정</h2>

<div class="card">
  <form method="POST">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 20px;">
      <div style="grid-column:1/-1;">
        <label>발신자 이름</label>
        <input name="smtp_from_name" value="{{ s.smtp_from_name }}" placeholder="Chardon QMS">
      </div>
      <div>
        <label>SMTP 서버 주소</label>
        <input name="smtp_host" value="{{ s.smtp_host }}" placeholder="smtp.gmail.com">
      </div>
      <div>
        <label>포트</label>
        <input name="smtp_port" value="{{ s.smtp_port or '587' }}" placeholder="587">
      </div>
      <div>
        <label>계정 (이메일)</label>
        <input name="smtp_user" type="email" value="{{ s.smtp_user }}" placeholder="your@gmail.com">
      </div>
      <div>
        <label>앱 비밀번호</label>
        <input name="smtp_pass" type="password" value="{{ s.smtp_pass }}"
               placeholder="Gmail 앱 비밀번호 16자리">
      </div>
    </div>
    <div class="hint" style="margin-top:10px;">
      Gmail 사용 시: Google 계정 → 보안 → 2단계 인증 활성화 후 "앱 비밀번호" 16자리 생성해서 입력.
    </div>
    <button type="submit" style="margin-top:16px; padding:12px 28px;">저장</button>
  </form>
</div>

<div class="card" style="margin-top:18px; border-left:4px solid #2563eb;">
  <h3 style="margin:0 0 8px; font-size:15px;">🗄️ DB 백업 이메일</h3>
  <p style="font-size:13px; color:#4b5563; margin:0 0 12px;">
    매일 <b>06:00 (KST)</b>에 <b>the.brilliant.pillar@gmail.com</b>으로 DB 파일을 자동 전송해.
    지금 바로 테스트 전송도 할 수 있어.
  </p>
  <form method="POST" action="{{ url_for('admin_backup_now') }}"
        onsubmit="return confirm('지금 바로 DB 백업을 이메일로 전송할까?');">
    <button type="submit" style="background:#2563eb; color:#fff; border:none;
            padding:10px 22px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">
      📤 지금 백업 전송
    </button>
  </form>
</div>
{% endblock %}
