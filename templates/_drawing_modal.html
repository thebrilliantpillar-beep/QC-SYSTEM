{# 도면 팝업 모달 (공용) — openDrawingModal(materialNo, label) 호출해서 사용.
   이 partial은 화면당 한 번만 include 할 것. #}
<div id="drawingModal" style="display:none; position:fixed; inset:0; z-index:9000;
     background:rgba(0,0,0,.6); align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:14px; width:min(96vw,900px); height:min(90vh,680px);
              display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,.35);">
    <div style="display:flex; align-items:center; justify-content:space-between;
                padding:12px 18px; border-bottom:1px solid #e5e7eb;">
      <span id="drawingModalTitle" style="font-weight:700; font-size:15px;">📐 도면</span>
      <button onclick="closeDrawingModal()" style="font-size:20px; background:none; border:none;
              cursor:pointer; color:#6b7280; padding:4px 8px; border-radius:6px;">✕</button>
    </div>
    <iframe id="drawingModalFrame" src="" style="flex:1; border:none;"></iframe>
  </div>
</div>
<script>
window.openDrawingModal = function(materialNo, label){
  var m = document.getElementById('drawingModal');
  document.getElementById('drawingModalTitle').textContent = '📐 도면 — ' + (label || materialNo);
  document.getElementById('drawingModalFrame').src = '/drawing/' + encodeURIComponent(materialNo);
  m.style.display = 'flex';
};
window.closeDrawingModal = function(){
  document.getElementById('drawingModal').style.display = 'none';
  document.getElementById('drawingModalFrame').src = '';
};
document.addEventListener('DOMContentLoaded', function(){
  var modal = document.getElementById('drawingModal');
  if (modal) modal.addEventListener('click', function(e){ if (e.target === this) closeDrawingModal(); });
});
</script>
