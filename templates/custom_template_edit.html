<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성적서 디자이너 · {{ tmpl['name'] }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg:#eef1f5; --chrome:#fff; --chrome-2:#f6f8fb; --ink:#1c2530; --ink-soft:#55606e;
    --muted:#8b97a6; --line:#dde3ec; --line-strong:#c6cfdb; --accent:#2f6df6; --accent-soft:#e7effe;
    --field:#6b3df6; --field-soft:#efeaff; --table:#0f8a6a; --table-soft:#e2f5ee; --danger:#dc2b3d;
    --paper:#fff; --paper-line:#eaedf2; --shadow:0 10px 30px rgba(23,37,60,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#10151d; --chrome:#1a212c; --chrome-2:#141b24; --ink:#e8edf4; --ink-soft:#aeb9c7;
      --muted:#74808f; --line:#29323f; --line-strong:#3a4552; --accent:#5b8cff; --accent-soft:#1b2740;
      --field:#a58bff; --field-soft:#241f3a; --table:#34c79c; --table-soft:#16302a; --danger:#ff6b78;
      --paper:#fff; --paper-line:#eaedf2; --shadow:0 12px 34px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --bg:#10151d; --chrome:#1a212c; --chrome-2:#141b24; --ink:#e8edf4; --ink-soft:#aeb9c7;
    --muted:#74808f; --line:#29323f; --line-strong:#3a4552; --accent:#5b8cff; --accent-soft:#1b2740;
    --field:#a58bff; --field-soft:#241f3a; --table:#34c79c; --table-soft:#16302a; --danger:#ff6b78;
    --paper:#fff; --paper-line:#eaedf2; --shadow:0 12px 34px rgba(0,0,0,.45);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR",system-ui,sans-serif; font-size:14px; -webkit-font-smoothing:antialiased; }
  .mono { font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .topbar { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--chrome);
    border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .topbar .back { color:var(--ink-soft); text-decoration:none; font-weight:700; font-size:13px; }
  .topbar .back:hover { color:var(--accent); }
  .topbar .nameinput { font:inherit; font-weight:700; font-size:15px; padding:6px 10px; min-width:180px;
    border:1px solid var(--line-strong); border-radius:8px; background:var(--chrome-2); color:var(--ink); }
  .spacer { flex:1; }
  .btn { font:inherit; font-weight:700; font-size:13px; padding:8px 14px; border-radius:9px; cursor:pointer;
    border:1px solid var(--line-strong); background:var(--chrome-2); color:var(--ink);
    transition:transform .05s,background .12s,border-color .12s; }
  .btn:hover { border-color:var(--accent); }
  .btn:active { transform:translateY(1px); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.ghost { border-color:transparent; background:transparent; color:var(--ink-soft); }
  .work { display:grid; grid-template-columns:224px 1fr 268px; height:calc(100vh - 58px); min-height:520px; }
  .panel { background:var(--chrome); overflow-y:auto; }
  .panel.left { border-right:1px solid var(--line); }
  .panel.right { border-left:1px solid var(--line); }
  .panel h3 { margin:0; padding:14px 16px 8px; font-size:11px; font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted); }
  .panel .hint { padding:0 16px 10px; color:var(--muted); font-size:11.5px; line-height:1.5; }
  .palette { padding:0 12px 16px; display:flex; flex-direction:column; gap:6px; }
  .pal { display:flex; align-items:center; gap:9px; padding:9px 11px; border:1px solid var(--line);
    border-radius:9px; background:var(--chrome-2); cursor:grab; user-select:none; font-size:13px; font-weight:500;
    transition:border-color .1s,background .1s; }
  .pal:hover { border-color:var(--accent); }
  .pal:active { cursor:grabbing; }
  .pal .ic { width:24px; height:24px; border-radius:6px; flex:0 0 auto; display:grid; place-items:center;
    font-size:13px; font-weight:800; background:var(--accent-soft); color:var(--accent); }
  .pal[data-kind="field"] .ic { background:var(--field-soft); color:var(--field); }
  .pal[data-kind="table"] .ic { background:var(--table-soft); color:var(--table); }
  .pal .sub { font-size:10.5px; color:var(--muted); font-weight:400; }
  .pal-group { padding:12px 16px 4px; font-size:10.5px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); }
  .stagewrap { display:flex; flex-direction:column; min-width:0; }
  .stagebar { display:flex; align-items:center; gap:14px; padding:9px 16px; background:var(--chrome-2);
    border-bottom:1px solid var(--line); font-size:12px; color:var(--ink-soft); }
  .chk { display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .chk input { accent-color:var(--accent); }
  .stage { background:var(--bg); overflow:auto; padding:30px; display:flex; justify-content:center; align-items:flex-start; flex:1; }
  .paper { position:relative; width:495px; height:700px; flex:0 0 auto; background:var(--paper);
    box-shadow:var(--shadow); border-radius:2px;
    background-image:linear-gradient(var(--paper-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--paper-line) 1px,transparent 1px); background-size:22px 22px; }
  .paper.clean { background-image:none; }
  .paper.clean .el { outline:none !important; }
  .paper.clean .el .el-tag { display:none; }
  .el { position:absolute; padding:3px 5px; cursor:move; outline:1px dashed var(--line-strong);
    color:#14324f; font-size:12px; line-height:1.35; display:flex; align-items:center; }
  .el.sel { outline:2px solid var(--accent); background:rgba(47,109,246,.05); z-index:5; }
  .el .el-tag { position:absolute; top:-17px; left:-1px; font-size:9px; font-weight:700; color:#fff;
    background:var(--line-strong); padding:1px 5px; border-radius:4px 4px 0 0; white-space:nowrap;
    font-family:"IBM Plex Mono",monospace; }
  .el.sel .el-tag { background:var(--accent); }
  .el.k-field { color:#4326a8; }
  .el.k-field.sel .el-tag, .el.k-field .el-tag { background:var(--field); }
  .el.k-field .val { background:var(--field-soft); padding:0 4px; border-radius:4px; }
  .el.k-table .el-tag { background:var(--table); }
  .el.k-logo { justify-content:center; }
  .el .handle { position:absolute; right:-5px; bottom:-5px; width:11px; height:11px; background:var(--accent);
    border:2px solid #fff; border-radius:3px; cursor:nwse-resize; display:none; }
  .el.sel .handle { display:block; }
  .logo-box { width:100%; height:100%; border:1px dashed #9aa6b6; border-radius:4px; display:grid;
    place-items:center; color:#6b7787; font-size:11px; font-weight:700;
    background:repeating-linear-gradient(45deg,#f4f6f9 0 6px,#eef1f5 6px 12px); }
  .mini-table { width:100%; border-collapse:collapse; font-size:8.5px; color:#22303f; }
  .mini-table th, .mini-table td { border:1px solid #9aa6b6; padding:2px 3px; text-align:center; }
  .mini-table th { background:#eef2f7; font-weight:700; }
  .divider-line { width:100%; height:0; border-top:1.5px solid #33465a; }
  .prop { padding:4px 16px 20px; }
  .prop .row { margin-bottom:12px; }
  .prop label { display:block; font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
  .prop input[type=text], .prop textarea, .prop select { width:100%; font:inherit; font-size:13px;
    padding:7px 9px; border:1px solid var(--line-strong); border-radius:8px; background:var(--chrome-2); color:var(--ink); }
  .prop textarea { resize:vertical; min-height:54px; }
  .prop .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .prop .num input { width:100%; text-align:right; font-family:"IBM Plex Mono",monospace; font-size:12px; }
  .seg { display:flex; gap:4px; }
  .seg button { flex:1; font:inherit; font-size:13px; font-weight:700; padding:7px 0; border:1px solid var(--line-strong);
    background:var(--chrome-2); color:var(--ink-soft); border-radius:8px; cursor:pointer; }
  .seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .prop .del { width:100%; margin-top:6px; padding:9px; border-radius:9px; cursor:pointer; border:1px solid var(--danger);
    background:transparent; color:var(--danger); font:inherit; font-weight:700; font-size:13px; }
  .empty-prop { padding:40px 20px; text-align:center; color:var(--muted); font-size:12.5px; line-height:1.6; }
  .empty-prop .big { font-size:26px; display:block; margin-bottom:8px; opacity:.5; }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:10px; font-size:13px; font-weight:600;
    box-shadow:var(--shadow); opacity:0; transition:opacity .2s,transform .2s; pointer-events:none; z-index:50; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition:none; } }
  @media (max-width: 900px) {
    .work { grid-template-columns:1fr; height:auto; }
    .panel.left, .panel.right { border:none; border-bottom:1px solid var(--line); max-height:none; }
    .stage { min-height:600px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="{{ url_for('custom_template_list') }}">← 양식 목록</a>
  <input class="nameinput" id="tmplName" type="text" value="{{ tmpl['name'] }}" placeholder="양식 이름">
  <span class="doc mono" style="color:var(--muted); font-size:12px;">A4 세로 · 495×700</span>
  <span class="spacer"></span>
  <button class="btn ghost" id="btnTheme" title="라이트/다크">◐ 테마</button>
  <button class="btn" id="btnClean">👁 미리보기 모드</button>
  <button class="btn" id="btnPdf">📄 PDF 미리보기</button>
  <button class="btn" id="btnAssign">🔗 자재에 지정</button>
  <button class="btn primary" id="btnSave">💾 저장</button>
</div>

<div class="work">
  <aside class="panel left">
    <h3>요소 팔레트</h3>
    <p class="hint">아래 항목을 <b>가운데 종이로 끌어다 놓으면</b> 배치돼. 출력할 때 실제 검사값이 채워져.</p>
    <div class="palette" id="palette">
      <div class="pal-group">기본</div>
      <div class="pal" draggable="true" data-kind="text"><span class="ic">T</span><span>텍스트<br><span class="sub">제목·안내문 직접 입력</span></span></div>
      <div class="pal" draggable="true" data-kind="logo"><span class="ic">▣</span><span>로고<br><span class="sub">회사 로고 이미지</span></span></div>
      <div class="pal" draggable="true" data-kind="divider"><span class="ic">—</span><span>구분선</span></div>
      <div class="pal" draggable="true" data-kind="sign"><span class="ic">✍</span><span>서명란<br><span class="sub">승인 서명 자동 삽입</span></span></div>
      <div class="pal-group">데이터 필드 <span style="text-transform:none;font-weight:400;">(자동 채움)</span></div>
      {% for f in field_keys %}
      <div class="pal" draggable="true" data-kind="field" data-field="{{ f }}"><span class="ic">#</span><span>{{ f }}</span></div>
      {% endfor %}
      <div class="pal-group">표</div>
      <div class="pal" draggable="true" data-kind="table"><span class="ic">▦</span><span>검사항목표<br><span class="sub">항목·규격·측정값 자동 생성</span></span></div>
    </div>
  </aside>

  <div class="stagewrap">
    <div class="stagebar">
      <label class="chk"><input type="checkbox" id="snap" checked> 격자에 맞추기</label>
      <span style="flex:1"></span>
      <span class="mono" id="coord">—</span>
    </div>
    <div class="stage">
      <div class="paper" id="paper"></div>
    </div>
  </div>

  <aside class="panel right">
    <h3>속성</h3>
    <div id="propWrap">
      <div class="empty-prop"><span class="big">☝</span>요소를 클릭하면<br>여기서 편집할 수 있어.</div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const paper = document.getElementById('paper');
  const propWrap = document.getElementById('propWrap');
  const coord = document.getElementById('coord');
  const snapChk = document.getElementById('snap');
  const GRID = 22;
  const CANVAS_W = {{ tmpl['canvas_w'] or 495 }}, CANVAS_H = {{ tmpl['canvas_h'] or 700 }};
  const SAVE_URL = {{ url_for('custom_template_save', template_id=tmpl['id']) | tojson }};
  const PREVIEW_URL = {{ url_for('custom_template_preview', template_id=tmpl['id']) | tojson }};
  const ASSIGN_URL = {{ url_for('custom_template_assign', template_id=tmpl['id']) | tojson }};
  const PING_URL = {{ url_for('session_ping') | tojson }};
  const SAVED_LAYOUT = JSON.parse({{ (tmpl['layout_json'] or '[]') | tojson }});
  let selected = null, dirty = false;

  const FIELD_SAMPLE = {
    '자재번호':'600005P086','제품명':'둥근머리 볼트(M416L,STS304)','업체명':'ACE',
    '검사일':'2026-08-23','검사자':'홍길동','로트번호':'CK260823-01',
    '도면번호':'A600005-086','입고수량':'2,000','종합판정':'합격',
  };

  // ── 표(검사항목표) 설정 ──
  const BIND_OPTS = ['항목','규격','검사방법','측정값','측정값1','측정값2','측정값3','측정값4','판정','blank'];
  const BIND_LABEL = {'blank':'(빈칸/수기)','측정값1':'측정값 1회','측정값2':'측정값 2회',
    '측정값3':'측정값 3회','측정값4':'측정값 4회'};
  function bindLabel(b){ return BIND_LABEL[b] || b; }
  const SUM_SOURCES = Object.keys(FIELD_SAMPLE);   // 자동 요약행이 끌어올 값
  const TABLE_SAMPLE = [
    {label:'*A',spec:'Ø9.0 ±0.1',method:'캘리퍼',value:'9.02, 9.01, 9.02',verdict:'합격'},
    {label:'B', spec:'16 +0.2',  method:'캘리퍼',value:'16.1, 16.0, 16.1',verdict:'합격'},
  ];
  function defaultTable(){
    return {
      columns:[
        {header:'항목',  bind:'항목',  width:13, align:'center'},
        {header:'규격',  bind:'규격',  width:34, align:'left'},
        {header:'검사방법',bind:'검사방법',width:16, align:'center'},
        {header:'측정값', bind:'측정값', width:22, align:'center'},
        {header:'판정',  bind:'판정',  width:15, align:'center'},
      ],
      groups:[], summaries:[],
    };
  }
  function cellSample(bind, r){
    if(bind==='blank') return '';
    var map={'항목':'label','규격':'spec','검사방법':'method','측정값':'value','판정':'verdict'};
    if(map[bind]) return r[map[bind]]||'';
    if(bind.indexOf('측정값')===0){
      var n=parseInt(bind.slice(3),10);
      if(n){ var p=(r.value||'').split(',').map(function(s){return s.trim();}); return p[n-1]||''; }
    }
    return '';
  }

  function snap(v){ return snapChk.checked ? Math.round(v/GRID)*GRID : Math.round(v); }
  function markDirty(){ dirty = true; }
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1900);
  }

  function makeEl(kind, opts){
    opts = opts || {};
    const el = document.createElement('div');
    el.className = 'el k-' + kind;
    el.dataset.kind = kind;
    el.dataset.size = String(opts.size || 12);
    el.dataset.bold = opts.bold ? '1' : '0';
    el.dataset.align = opts.align || 'left';
    if (kind === 'field') el.dataset.field = opts.field || '자재번호';
    el.dataset.text = opts.text || '';
    if (kind === 'table') {
      el._table = (opts.columns && opts.columns.length)
        ? JSON.parse(JSON.stringify({columns:opts.columns, groups:opts.groups||[], summaries:opts.summaries||[]}))
        : defaultTable();
    }
    const w = opts.w || defaultW(kind), h = opts.h || defaultH(kind);
    el.style.left = (opts.x || 40) + 'px';
    el.style.top = (opts.y || 40) + 'px';
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    const tag = document.createElement('span'); tag.className = 'el-tag'; el.appendChild(tag);
    const handle = document.createElement('span'); handle.className = 'handle'; el.appendChild(handle);
    const body = document.createElement('span'); body.className = 'body'; body.style.width = '100%'; el.appendChild(body);
    paper.appendChild(el);
    renderEl(el); wireEl(el, handle);
    return el;
  }
  function defaultW(k){ return k==='table'?451:k==='divider'?300:k==='logo'?150:k==='sign'?120:150; }
  function defaultH(k){ return k==='table'?150:k==='divider'?10:k==='logo'?54:k==='sign'?46:22; }

  function renderEl(el){
    const kind = el.dataset.kind;
    const tag = el.querySelector('.el-tag');
    const body = el.querySelector('.body');
    const size = el.dataset.size, bold = el.dataset.bold === '1', align = el.dataset.align;
    body.style.fontSize = size + 'px';
    body.style.fontWeight = bold ? '700' : '400';
    body.style.textAlign = align;
    body.style.display = 'block';
    if (kind === 'text') {
      tag.textContent = 'T 텍스트';
      body.textContent = el.dataset.text || '제목을 입력하세요';
    } else if (kind === 'field') {
      const f = el.dataset.field;
      tag.textContent = '# ' + f;
      body.innerHTML = '<span class="val">' + (FIELD_SAMPLE[f] || f) + '</span>';
    } else if (kind === 'logo') {
      tag.textContent = '▣ 로고';
      body.innerHTML = '<span class="logo-box">CHARDON GROUP</span>';
      body.style.height = '100%';
    } else if (kind === 'divider') {
      tag.textContent = '— 구분선';
      body.innerHTML = '<span class="divider-line"></span>';
    } else if (kind === 'sign') {
      tag.textContent = '✍ 서명란';
      body.innerHTML = '<span class="logo-box" style="background:none;border-style:solid;">서명</span>';
      body.style.height = '100%';
    } else if (kind === 'table') {
      tag.textContent = '▦ 검사항목표';
      body.innerHTML = miniTableHTML(el._table || defaultTable());
    }
  }

  function miniTableHTML(t){
    var cols=t.columns||[], groups=t.groups||[], summ=t.summaries||[];
    var grouped={}; groups.forEach(function(g){ for(var i=g.start;i<g.start+g.span;i++) grouped[i]=g; });
    var ncol=cols.length||1;
    var html='<table class="mini-table"><thead>';
    if(groups.length){
      html+='<tr>';
      for(var i=0;i<cols.length;){
        if(grouped[i] && grouped[i].start===i){ html+='<th colspan="'+grouped[i].span+'">'+esc(grouped[i].label)+'</th>'; i+=grouped[i].span; }
        else if(grouped[i]){ i++; }
        else { html+='<th rowspan="2">'+esc(cols[i].header)+'</th>'; i++; }
      }
      html+='</tr><tr>';
      cols.forEach(function(c,i){ if(grouped[i]) html+='<th>'+esc(c.header)+'</th>'; });
      html+='</tr>';
    } else {
      html+='<tr>'+cols.map(function(c){return '<th>'+esc(c.header)+'</th>';}).join('')+'</tr>';
    }
    html+='</thead><tbody>';
    TABLE_SAMPLE.forEach(function(r){
      html+='<tr>'+cols.map(function(c){return '<td style="text-align:'+c.align+'">'+esc(cellSample(c.bind,r))+'</td>';}).join('')+'</tr>';
    });
    html+='<tr><td colspan="'+ncol+'" style="color:#6b7787;font-style:italic;">…항목 수만큼 자동 확장…</td></tr>';
    summ.forEach(function(s){
      var v = s.mode==='auto' ? (FIELD_SAMPLE[s.source]||s.source||'') : (s.value||'');
      html+='<tr><td style="font-weight:700;background:#f1f4f8">'+esc(s.label)+'</td><td colspan="'+(ncol-1)+'">'+esc(v)+'</td></tr>';
    });
    return html+'</tbody></table>';
  }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function _noop(){
  }

  function select(el){
    if (selected) selected.classList.remove('sel');
    selected = el;
    if (el) { el.classList.add('sel'); buildProps(el); }
    else propWrap.innerHTML = '<div class="empty-prop"><span class="big">☝</span>요소를 클릭하면<br>여기서 편집할 수 있어.</div>';
  }

  function wireEl(el, handle){
    el.addEventListener('mousedown', function(e){
      if (e.target === handle) return;
      select(el);
      const sx = e.clientX, sy = e.clientY;
      const ox = parseFloat(el.style.left), oy = parseFloat(el.style.top);
      function mv(ev){
        let nx = snap(ox + ev.clientX - sx), ny = snap(oy + ev.clientY - sy);
        nx = Math.max(0, Math.min(nx, paper.clientWidth - el.offsetWidth));
        ny = Math.max(0, Math.min(ny, paper.clientHeight - el.offsetHeight));
        el.style.left = nx + 'px'; el.style.top = ny + 'px';
        coord.textContent = 'X ' + nx + '  Y ' + ny; syncNums(el); markDirty();
      }
      function up(){ document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); }
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
      e.preventDefault();
    });
    handle.addEventListener('mousedown', function(e){
      select(el);
      const sx = e.clientX, sy = e.clientY;
      const ow = el.offsetWidth, oh = el.offsetHeight;
      function mv(ev){
        let nw = snap(Math.max(30, ow + ev.clientX - sx));
        let nh = snap(Math.max(14, oh + ev.clientY - sy));
        el.style.width = nw + 'px'; el.style.height = nh + 'px';
        coord.textContent = 'W ' + nw + '  H ' + nh; syncNums(el); markDirty();
      }
      function up(){ document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); }
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
      e.stopPropagation(); e.preventDefault();
    });
  }

  paper.addEventListener('mousedown', function(e){ if (e.target === paper) select(null); });

  document.querySelectorAll('.pal').forEach(function(p){
    p.addEventListener('dragstart', function(e){
      e.dataTransfer.setData('kind', p.dataset.kind);
      e.dataTransfer.setData('field', p.dataset.field || '');
    });
  });
  paper.addEventListener('dragover', function(e){ e.preventDefault(); });
  paper.addEventListener('drop', function(e){
    e.preventDefault();
    const kind = e.dataTransfer.getData('kind');
    if (!kind) return;
    const r = paper.getBoundingClientRect();
    const el = makeEl(kind, {
      x: snap(e.clientX - r.left - 30),
      y: snap(e.clientY - r.top - 12),
      field: e.dataTransfer.getData('field') || '자재번호',
    });
    select(el); markDirty();
    toast('요소를 놓았어 — 오른쪽에서 편집하면 돼');
  });

  function buildProps(el){
    const kind = el.dataset.kind;
    const kindName = {text:'텍스트',field:'데이터 필드',logo:'로고',divider:'구분선',sign:'서명란',table:'검사항목표'}[kind];
    let html = '<div class="prop">';
    html += '<div class="row"><label>요소 종류</label><div class="mono" style="font-size:12px;color:var(--muted)">' + kindName + '</div></div>';
    if (kind === 'text')
      html += '<div class="row"><label>내용</label><textarea id="pText">' + (el.dataset.text || '') + '</textarea></div>';
    if (kind === 'field') {
      html += '<div class="row"><label>연결할 데이터</label><select id="pField">' +
        Object.keys(FIELD_SAMPLE).map(f=>'<option '+(f===el.dataset.field?'selected':'')+'>'+f+'</option>').join('') +
        '</select><div style="font-size:11px;color:var(--muted);margin-top:5px">출력 시 이 자리에 실제 검사값이 채워져.</div></div>';
    }
    if (kind === 'text' || kind === 'field') {
      html += '<div class="row grid2"><div><label>글자 크기</label><div class="num"><input type="text" id="pSize" value="'+el.dataset.size+'"></div></div>' +
        '<div><label>굵기</label><div class="seg" style="margin-top:0"><button id="pBold" class="'+(el.dataset.bold==='1'?'on':'')+'">굵게</button></div></div></div>';
      html += '<div class="row"><label>정렬</label><div class="seg" id="pAlign">' +
        ['left','center','right'].map(a=>'<button data-a="'+a+'" class="'+(el.dataset.align===a?'on':'')+'">'+({left:'좌',center:'중',right:'우'}[a])+'</button>').join('') +
        '</div></div>';
    }
    if (kind === 'table')
      html += '<div id="tblMount"></div>';
    html += '<div class="row"><label>위치 / 크기 (px)</label><div class="grid2">' +
      '<div class="num"><input type="text" id="pX" value="'+parseInt(el.style.left)+'"></div>' +
      '<div class="num"><input type="text" id="pY" value="'+parseInt(el.style.top)+'"></div>' +
      '<div class="num"><input type="text" id="pW" value="'+el.offsetWidth+'"></div>' +
      '<div class="num"><input type="text" id="pH" value="'+el.offsetHeight+'"></div>' +
      '</div><div style="font-size:10.5px;color:var(--muted);margin-top:4px" class="mono">X · Y · W · H</div></div>';
    html += '<button class="del" id="pDel">🗑 이 요소 삭제</button></div>';
    propWrap.innerHTML = html;

    const t = document.getElementById('pText');
    if (t) t.addEventListener('input', ()=>{ el.dataset.text = t.value; renderEl(el); markDirty(); });
    const f = document.getElementById('pField');
    if (f) f.addEventListener('change', ()=>{ el.dataset.field = f.value; renderEl(el); markDirty(); });
    const sz = document.getElementById('pSize');
    if (sz) sz.addEventListener('input', ()=>{ el.dataset.size = sz.value || '12'; renderEl(el); markDirty(); });
    const b = document.getElementById('pBold');
    if (b) b.addEventListener('click', ()=>{ el.dataset.bold = el.dataset.bold==='1'?'0':'1'; b.classList.toggle('on'); renderEl(el); markDirty(); });
    const al = document.getElementById('pAlign');
    if (al) al.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', ()=>{
      el.dataset.align = btn.dataset.a; renderEl(el);
      al.querySelectorAll('button').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); markDirty();
    }));
    [['pX','left'],['pY','top'],['pW','width'],['pH','height']].forEach(([id,prop])=>{
      const inp = document.getElementById(id);
      inp.addEventListener('input', ()=>{ el.style[prop] = (parseInt(inp.value)||0) + 'px'; markDirty(); });
    });
    document.getElementById('pDel').addEventListener('click', ()=>{ el.remove(); select(null); markDirty(); toast('삭제했어'); });
    if (kind === 'table') renderTableEditor(el);
  }

  // ── 표 편집기(열·묶음 머리행·요약행) ──

        '</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">'+
          '<input type="text" data-th="'+i+'" value="'+esc(c.header)+'" placeholder="머리글자" style="grid-column:1/3">'+
          '<select data-tb="'+i+'">'+optHtml(c.bind)+'</select>'+
          '<div style="display:grid;grid-template-columns:1fr 1fr auto;gap:4px">'+
            '<input type="text" data-tw="'+i+'" value="'+c.width+'" title="너비%" style="text-align:right;font-family:monospace">'+
            '<select data-ta="'+i+'">'+alignHtml(c.align)+'</select>'+
            '<button data-tdel="'+i+'" title="삭제" style="border:1px solid var(--danger);background:transparent;color:var(--danger);border-radius:6px;cursor:pointer;padding:0 7px">✕</button>'+

        '</div>'+
      '</div>';
    });
    h += '<button data-tadd="1" style="width:100%;padding:7px;border:1px dashed var(--line-strong);background:transparent;color:var(--ink-soft);border-radius:8px;cursor:pointer;font:inherit;font-size:12px">+ 열 추가</button>';
    h += '<div style="display:flex;gap:5px;margin-top:6px">'+
      '<button data-tmeas="multi" style="flex:1;padding:6px;border:1px solid var(--line-strong);background:var(--chrome-2);color:var(--ink-soft);border-radius:7px;cursor:pointer;font:inherit;font-size:11.5px">측정값 → 회차별</button>'+
      '<button data-tmeas="one" style="flex:1;padding:6px;border:1px solid var(--line-strong);background:var(--chrome-2);color:var(--ink-soft);border-radius:7px;cursor:pointer;font:inherit;font-size:11.5px">측정값 → 한 칸</button>'+
      '</div></div>';

    // 묶음 머리행
    h += '<div class="row"><label>묶음 머리행 (병합)</label>';
    if (t.groups.length){
      t.groups.forEach((g,i)=>{
        const names = cols.slice(g.start,g.start+g.span).map(c=>c.header).join(' · ');
        h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:12px">'+
          '<span style="background:var(--table-soft);color:var(--table);padding:2px 8px;border-radius:6px;font-weight:700">'+esc(g.label)+'</span>'+
          '<span style="color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(names)+'</span>'+
          '<button data-gdel="'+i+'" style="border:1px solid var(--danger);background:transparent;color:var(--danger);border-radius:6px;cursor:pointer;padding:0 7px">✕</button>'+
        '</div>';
      });
    }
    const freeCols = cols.map((c,i)=>i).filter(i=>!t.groups.some(g=>i>=g.start&&i<g.start+g.span));
    h += '<div style="display:grid;grid-template-columns:1fr 54px auto;gap:4px;margin-top:4px">'+
      '<input type="text" id="gLabel" placeholder="묶음 이름 (예: 측정값)">'+
      '<select id="gStart" title="시작 열">'+cols.map((c,i)=>'<option value="'+i+'">'+esc(c.header||('열'+(i+1)))+'</option>').join('')+'</select>'+
      '<input type="text" id="gSpan" value="2" title="열 개수" style="width:48px;text-align:right;font-family:monospace">'+

      '<button id="gAdd" style="width:100%;margin-top:5px;padding:6px;border:1px dashed var(--line-strong);background:transparent;color:var(--ink-soft);border-radius:8px;cursor:pointer;font:inherit;font-size:12px">+ 선택한 열들 묶기</button>'+
      '<div style="font-size:10.5px;color:var(--muted);margin-top:4px">시작 열부터 연속한 열 개수만큼 하나의 상위 머리글로 덮어. 이미 묶인 열은 겹칠 수 없어.</div>'+
      '</div>';

    // 요약행
    h += '<div class="row"><label>요약행 (표 맨 아래 고정)</label>';

          '<button data-sdel="'+i+'" style="border:1px solid var(--danger);background:transparent;color:var(--danger);border-radius:6px;cursor:pointer;padding:0 8px">✕</button>'+
        '</div>'+
        '<div class="seg" style="margin-bottom:5px">'+
          '<button data-smode="'+i+'" data-mv="auto" class="'+(s.mode==='auto'?'on':'')+'" style="font-size:12px">자동(검사값)</button>'+
          '<button data-smode="'+i+'" data-mv="text" class="'+(s.mode!=='auto'?'on':'')+'" style="font-size:12px">고정 텍스트</button>'+
        '</div>'+
        (s.mode==='auto'
          ? '<select data-ssrc="'+i+'">'+SUM_SOURCES.map(f=>'<option'+(f===s.source?' selected':'')+'>'+f+'</option>').join('')+'</select>'
          : '<input type="text" data-sval="'+i+'" value="'+esc(s.value)+'" placeholder="표시할 내용">')+
      '</div>';
    });
    h += '<button id="sAdd" style="width:100%;padding:7px;border:1px dashed var(--line-strong);background:transparent;color:var(--ink-soft);border-radius:8px;cursor:pointer;font:inherit;font-size:12px">+ 요약행 추가</button>';
    h += '</div>';

    mount.innerHTML = h;

    const changed = ()=>{ renderEl(el); markDirty(); renderTableEditor(el); };
    const q = (sel,fn)=>mount.querySelectorAll(sel).forEach(fn);

    q('[data-th]', inp=>inp.addEventListener('input', ()=>{ cols[+inp.dataset.th].header = inp.value; renderEl(el); markDirty(); }));
    q('[data-tb]', s=>s.addEventListener('change', ()=>{ const i=+s.dataset.tb; cols[i].bind=s.value; if(!cols[i].header||BIND_OPTS.indexOf(cols[i].header)>=0) cols[i].header=bindLabel(s.value); changed(); }));
    q('[data-tw]', inp=>inp.addEventListener('input', ()=>{ cols[+inp.dataset.tw].width = Math.max(1, parseInt(inp.value)||10); renderEl(el); markDirty(); }));
    q('[data-ta]', s=>s.addEventListener('change', ()=>{ cols[+s.dataset.ta].align = s.value; renderEl(el); markDirty(); }));
    q('[data-tup]', b=>b.addEventListener('click', ()=>{ const i=+b.dataset.tup; if(i>0){ [cols[i-1],cols[i]]=[cols[i],cols[i-1]]; t.groups=[]; changed(); } }));
    q('[data-tdn]', b=>b.addEventListener('click', ()=>{ const i=+b.dataset.tdn; if(i<cols.length-1){ [cols[i+1],cols[i]]=[cols[i],cols[i+1]]; t.groups=[]; changed(); } }));
    q('[data-tdel]', b=>b.addEventListener('click', ()=>{ if(cols.length>1){ cols.splice(+b.dataset.tdel,1); t.groups=[]; changed(); } else toast('열은 최소 1개는 있어야 해'); }));
    const addBtn = mount.querySelector('[data-tadd]');
    if (addBtn) addBtn.addEventListener('click', ()=>{ cols.push({header:'새 열',bind:'blank',width:12,align:'center'}); changed(); });

    q('[data-tmeas]', b=>b.addEventListener('click', ()=>{ setMeasureMode(t, b.dataset.tmeas); changed(); }));

    q('[data-gdel]', b=>b.addEventListener('click', ()=>{ t.groups.splice(+b.dataset.gdel,1); changed(); }));
    const gAdd = mount.querySelector('#gAdd');
    if (gAdd) gAdd.addEventListener('click', ()=>{
      const label=(mount.querySelector('#gLabel').value||'').trim();
      const start=parseInt(mount.querySelector('#gStart').value)||0;
      const span=parseInt(mount.querySelector('#gSpan').value)||0;
      if(!label){ toast('묶음 이름을 적어줘'); return; }
      if(span<2){ toast('2개 이상 열을 묶어야 해'); return; }
      if(start+span>cols.length){ toast('열 범위를 벗어났어'); return; }
      for(let i=start;i<start+span;i++) if(t.groups.some(g=>i>=g.start&&i<g.start+g.span)){ toast('이미 묶인 열이 포함돼 있어'); return; }
      t.groups.push({label,start,span}); t.groups.sort((a,b)=>a.start-b.start); changed();
    });

    q('[data-slabel]', inp=>inp.addEventListener('input', ()=>{ t.summaries[+inp.dataset.slabel].label = inp.value; renderEl(el); markDirty(); }));
    q('[data-sval]', inp=>inp.addEventListener('input', ()=>{ t.summaries[+inp.dataset.sval].value = inp.value; renderEl(el); markDirty(); }));
    q('[data-ssrc]', s=>s.addEventListener('change', ()=>{ t.summaries[+s.dataset.ssrc].source = s.value; renderEl(el); markDirty(); }));
    q('[data-smode]', b=>b.addEventListener('click', ()=>{ t.summaries[+b.dataset.smode].mode = b.dataset.mv; changed(); }));
    q('[data-sdel]', b=>b.addEventListener('click', ()=>{ t.summaries.splice(+b.dataset.sdel,1); changed(); }));
    const sAdd = mount.querySelector('#sAdd');
    if (sAdd) sAdd.addEventListener('click', ()=>{ t.summaries.push({label:'종합판정',mode:'auto',source:'종합판정',value:''}); changed(); });
  }

  function setMeasureMode(t, mode){
    const cols = t.columns;
    const isSample = b => /^측정값[1-9]$/.test(b);
    if (mode === 'multi'){
      const i = cols.findIndex(c=>c.bind==='측정값');
      if (i<0) { toast('“측정값” 열이 없어'); return; }
      const w = Math.max(6, Math.round(cols[i].width/3));
      cols.splice(i,1,
        {header:'1회',bind:'측정값1',width:w,align:'center'},
        {header:'2회',bind:'측정값2',width:w,align:'center'},
        {header:'3회',bind:'측정값3',width:w,align:'center'});
      t.groups=[]; t.groups.push({label:'측정값',start:i,span:3});
    } else {
      const first = cols.findIndex(c=>isSample(c.bind));
      if (first<0) return;
      const kept = cols.filter(c=>!isSample(c.bind));
      const removed = cols.length - kept.length;
      kept.splice(first,0,{header:'측정값',bind:'측정값',width:22,align:'center'});
      t.columns = kept; t.groups=[];
    }
  }
  function syncNums(el){
    const map = {pX:parseInt(el.style.left),pY:parseInt(el.style.top),pW:el.offsetWidth,pH:el.offsetHeight};
    for (const id in map){ const i = document.getElementById(id); if (i) i.value = map[id]; }
  }

  // Delete 키로 선택 요소 삭제
  document.addEventListener('keydown', function(e){
    if ((e.key === 'Delete' || e.key === 'Backspace') && selected &&
        !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      selected.remove(); select(null); markDirty(); e.preventDefault();
    }
  });

  // ── 직렬화 / 저장 ──
  function serialize(){
    const out = [];
    paper.querySelectorAll('.el').forEach(el=>{
      const o = {
        kind: el.dataset.kind,
        x: parseInt(el.style.left) || 0,
        y: parseInt(el.style.top) || 0,
        w: el.offsetWidth,
        h: el.offsetHeight,
        size: parseInt(el.dataset.size) || 12,
        bold: el.dataset.bold === '1',
        align: el.dataset.align || 'left',
      };
      if (el.dataset.kind === 'field') o.field = el.dataset.field;
      if (el.dataset.kind === 'text') o.text = el.dataset.text || '';
      if (el.dataset.kind === 'table') {
        const t = el._table || defaultTable();
        o.columns = t.columns; o.groups = t.groups; o.summaries = t.summaries;
      }
      out.push(o);
    });
    return out;
  }
  async function save(){
    const payload = {
      name: document.getElementById('tmplName').value.trim() || '제목 없음',
      layout: serialize(),
      canvas_w: CANVAS_W, canvas_h: CANVAS_H, orientation: 'portrait',
    };
    let res;
    try {
      res = await fetch(SAVE_URL, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload),
      });
    } catch (e) {
      toast('저장 실패: 서버에 연결 못 했어(네트워크 확인). 작업 내용은 그대로 남아 있어.');
      return false;
    }
    // 세션이 끊기면 서버가 로그인 화면(HTML)으로 돌려보낸다 → JSON이 아니므로 명확히 안내
    if (res.status === 401 || res.redirected || /\/login/.test(res.url)) {
      showSessionExpired(); return false;
    }
    const j = await res.json().catch(()=>null);
    if (j && j.ok) { dirty = false; hideSessionExpired(); return true; }
    toast('저장 실패: ' + ((j && j.error) || '알 수 없는 오류') + ' (작업 내용은 그대로 남아 있어)');
    return false;
  }

  // ── 세션 유지(하트비트) & 만료 안내 ──
  // 디자이너는 서버 요청 없이 오래 머무는 화면이라, 활동이 있으면 주기적으로 서버에 신호를
  // 보내 '계정 관리' 권한 계정의 10분 자동 로그아웃을 막는다(가만히 두면 정상적으로 만료됨).
  let _lastActivity = Date.now();
  ['pointerdown','keydown','mousemove','wheel','touchstart'].forEach(function(ev){
    document.addEventListener(ev, function(){ _lastActivity = Date.now(); }, {passive:true});
  });
  function showSessionExpired(){
    let b = document.getElementById('sessBanner');
    if (!b){
      b = document.createElement('div'); b.id = 'sessBanner';
      b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;background:#c0392b;'
        + 'color:#fff;padding:10px 14px;text-align:center;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.3)';
      document.body.appendChild(b);
    }
    b.innerHTML = '⚠ 로그인이 풀렸어요(오래 자리를 비우면 자동 로그아웃돼요). '
      + '<a href="/login?next=/custom-templates" target="_blank" style="color:#fff;text-decoration:underline">새 탭에서 다시 로그인</a>'
      + ' 한 뒤, 이 화면으로 돌아와 <b>저장</b>을 다시 눌러주세요. 지금까지 작업한 내용은 그대로 남아 있어요.';
    b.style.display = 'block';
  }
  function hideSessionExpired(){
    const b = document.getElementById('sessBanner'); if (b) b.style.display = 'none';
  }
  async function heartbeat(){
    // 최근 5분 안에 활동이 있었을 때만 세션을 연장한다(자리 비우면 자동 로그아웃 유지)
    if (Date.now() - _lastActivity > 5*60*1000) return;
    try {
      const r = await fetch(PING_URL, {method:'POST'});
      if (r.status === 401) showSessionExpired(); else hideSessionExpired();
    } catch (e) { /* 네트워크 일시 오류는 무시 */ }
  }
  setInterval(heartbeat, 3*60*1000);   // 3분마다(10분 만료 전에 넉넉히 연장)

  document.getElementById('btnSave').addEventListener('click', async ()=>{
    if (await save()) toast('저장했어 💾');
  });
  document.getElementById('btnPdf').addEventListener('click', async ()=>{
    toast('저장 후 PDF를 여는 중…');
    if (await save()) window.open(PREVIEW_URL, '_blank');
  });
  document.getElementById('btnAssign').addEventListener('click', async ()=>{
    if (dirty) { if (!await save()) return; }
    window.location = ASSIGN_URL;
  });
  document.getElementById('btnClean').addEventListener('click', function(){
    paper.classList.toggle('clean');
    if (selected) selected.classList.remove('sel');
    this.classList.toggle('primary');
    toast(paper.classList.contains('clean') ? '미리보기 모드 — 실제 출력 모습' : '편집 모드로 돌아왔어');
  });
  document.getElementById('btnTheme').addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });
  document.getElementById('tmplName').addEventListener('input', markDirty);

  window.addEventListener('beforeunload', function(e){
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  // ── 초기 로드 ──
  function starterLayout(){
    makeEl('logo',    {x:22,  y:22,  w:150, h:54});
    makeEl('text',    {x:198, y:22,  w:275, h:30, text:'입고 자재 검사 성적서', size:19, bold:true, align:'center'});
    makeEl('text',    {x:198, y:56,  w:275, h:16, text:'문서번호 XD-P-01901A', size:10, align:'center'});
    makeEl('divider', {x:22,  y:88,  w:451, h:8});
    makeEl('field',   {x:22,  y:110, w:200, h:20, field:'자재번호', size:12, bold:true});
    makeEl('field',   {x:242, y:110, w:231, h:20, field:'제품명', size:12});
    makeEl('field',   {x:22,  y:134, w:200, h:20, field:'업체명', size:12});
    makeEl('field',   {x:242, y:134, w:120, h:20, field:'검사일', size:12});
    makeEl('field',   {x:376, y:134, w:97,  h:20, field:'입고수량', size:12});
    makeEl('table',   {x:22,  y:170, w:451, h:150});
    makeEl('field',   {x:22,  y:344, w:160, h:18, field:'검사자', size:11});
    makeEl('sign',    {x:353, y:338, w:120, h:46});
  }
  if (Array.isArray(SAVED_LAYOUT) && SAVED_LAYOUT.length) {
    SAVED_LAYOUT.forEach(o=>makeEl(o.kind, o));
  } else {
    starterLayout();
  }
  select(null);
  dirty = false;
})();
</script>
</body>
</html>
