{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="card" style="max-width:340px; margin:40px auto;">
  <h2 style="text-align:center;">🧪 IQC Inspection Automation & Management System</h2>
  <img src="{{ url_for('static', filename='login_transformer_recloser.png') }}"
       alt="트랜스포머-리클로져의 역습"
       style="display:block; width:100%; max-width:280px; margin:0 auto 6px; border-radius:10px;">
  <p style="text-align:center; margin:0 0 16px; font-size:13px; color:var(--muted);">트랜스포머 - 리클로져의 역습</p>
  <form method="POST">
    <label>아이디</label>
    <input name="username" required autofocus>
    <label>비밀번호</label>
    <input name="password" type="password" required>
    <button type="submit" style="width:100%;">로그인</button>
  </form>
</div>
{% endblock %}
