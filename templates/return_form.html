{% extends "base.html" %}
{% block title %}반품 등록 — Chardon QMS{% endblock %}
{% block content %}
<a href="{{ url_for('inspection_detail', inspection_id=header['id']) }}" style="font-size:13px; color:var(--muted); text-decoration:none;">← 성적서로 돌아가기</a>

<h2 style="margin-top:10px;">🔄 반품 처리 등록</h2>

<div class="card" style="margin-bottom:14px; background:#fef3c7; border:1px solid #fbbf24;">
  <div style="font-weight:700; margin-bottom:4px;">{{ header['material_no'] }} — {{ header['material_name'] }}</div>
  <div style="font-size:13px; color:#92400e;">업체: {{ header['supplier'] or '-' }}</div>
</div>

<form method="post">
  <label>반품 날짜</label>
  <input type="date" name="return_date" value="{{ today }}" required>

  <label>반품 수량 (선택)</label>
  <input type="text" name="quantity" placeholder="예: 500ea, 2박스">

  <label>반품 사유</label>
  <textarea name="reason" rows="4" required placeholder="불량 내용, 발생 경위 등을 간략히 입력해줘."></textarea>

  <button type="submit" style="margin-top:20px;">반품 등록</button>
  <a href="{{ url_for('inspection_detail', inspection_id=header['id']) }}" class="btn secondary" style="margin-left:10px;">취소</a>
</form>
{% endblock %}
