{% extends "base.html" %}
{% block title %}새 생산 LOT — Chardon QMS{% endblock %}
{% block content %}
<h2>새 생산 LOT</h2>
<p><a href="{{ url_for('production_lot_list') }}">← 목록으로</a></p>

<div class="card">
  <form method="POST" action="{{ url_for('production_lot_new') }}">
    <label>모델 (사용 중인 모델만)</label>
    <select name="model_id" required>
      <option value="">선택</option>
      {% for m in models %}
      <option value="{{ m['id'] }}" {{ 'selected' if form.get('model_id') == m['id']|string else '' }}>{{ m['model_no'] }} {{ m['display_name'] or '' }}</option>
      {% endfor %}
    </select>
    <label><input type="checkbox" name="is_test" value="1" {{ 'checked' if form.get('is_test') == '1' else '' }} style="width:auto;"> 테스트 LOT</label>
    <label>비고</label>
    <input type="text" name="note" value="{{ form.get('note') or '' }}">
    <button type="submit">LOT 만들기</button>
  </form>
</div>
{% endblock %}
