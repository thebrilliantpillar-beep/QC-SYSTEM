services:
  - type: web
    name: chardon-qms
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 600 --workers 1
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: iqc-data
      mountPath: /var/data
      sizeGB: 1
